syntax = "proto3";

package tests.includeschema.fieldcollision.v1;

import "google/api/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/includeschema/fieldcollision/v1;fieldcollision";

// FieldCollision reaches its colliding Standalone through a field rather than
// through an operation, so the collision only becomes visible while the schemas
// are being generated.
service FieldCollision {
  rpc GetWrapper(GetWrapperRequest) returns (Wrapper) {
    option (google.api.http) = {
      get : "/v1/fieldcollision/wrapper/{id}"
    };
  }
}

message GetWrapperRequest {
  string id = 1;
}

message Wrapper {
  Standalone inner = 1;
}

message Standalone {
  string other = 1;
}
