syntax = "proto3";

package tests.includeschema.imported.v1;

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/includeschema/imported/v1;imported";

// Detached is declared in a file with no service, so it only ever reaches a
// generator as an import of importer.proto.
message Detached {
  string id = 1;
}
