syntax = "proto3";

package tests.includeschema.message.v1;

import "google/api/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/includeschema/message/v1;message";

// Messaging service
service Messaging {
  rpc GetMessage(Message) returns (Message) {
    option (google.api.http) = {
      get : "/v1/messages/{message_id}"
    };
  }
}

message Message {
  string message_id = 1;
}

// Standalone is reachable from no operation. Including it must also pull in
// StandaloneChild, which it references but nothing else does.
message Standalone {
  string name = 1;
  StandaloneChild child = 2;
  map<string, StandaloneChild> children = 3;
}

// StandaloneChild is only ever reached through Standalone.
message StandaloneChild {
  string id = 1;
}

// Outer holds a nested message, whose proto name is Outer.Inner but whose
// schema name is Outer_Inner.
message Outer {
  message Inner {
    string value = 1;
  }

  Inner inner = 1;
}
