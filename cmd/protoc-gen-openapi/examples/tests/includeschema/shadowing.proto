syntax = "proto3";

package tests.includeschema.shadowing.v1;

import "google/api/annotations.proto";
import "tests/includeschema/imported.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/includeschema/shadowing/v1;shadowing";

// Shadowing returns the imported Detached, while declaring a Detached of its own
// that nothing references. Both format to the schema name "Detached", so the
// definition the document keeps has to be the one the operation refers to.
service Shadowing {
  rpc GetDetached(GetDetachedRequest) returns (tests.includeschema.imported.v1.Detached) {
    option (google.api.http) = {
      get : "/v1/shadowing/detached/{id}"
    };
  }
}

message GetDetachedRequest {
  string id = 1;
}

// Detached is reached from nothing. Its field name is what tells it apart from
// the imported message of the same name.
message Detached {
  string shadow = 1;
}
