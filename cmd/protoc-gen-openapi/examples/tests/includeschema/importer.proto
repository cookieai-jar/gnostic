syntax = "proto3";

package tests.includeschema.importer.v1;

import "google/api/annotations.proto";
import "tests/includeschema/imported.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/includeschema/importer/v1;importer";

service Importer {
  rpc GetThing(GetThingRequest) returns (Thing) {
    option (google.api.http) = {
      get : "/v1/importer/things/{id}"
    };
  }
}

message GetThingRequest {
  string id = 1;
}

message Thing {
  string name = 1;
}

// Holder keeps the import in use without making Detached reachable from an
// operation, which is what include_schema is for.
message Holder {
  tests.includeschema.imported.v1.Detached detached = 1;
}
