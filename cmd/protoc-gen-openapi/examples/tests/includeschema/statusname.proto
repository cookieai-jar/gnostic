syntax = "proto3";

package tests.includeschema.statusname.v1;

import "google/api/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/includeschema/statusname/v1;statusname";

// StatusName declares a Status, the schema name the default error response
// already emits google.rpc.Status under.
service StatusName {
  rpc GetThing(GetThingRequest) returns (GetThingRequest) {
    option (google.api.http) = {
      get : "/v1/statusname/things/{id}"
    };
  }
}

message GetThingRequest {
  string id = 1;
}

message Status {
  string mine = 1;
}
