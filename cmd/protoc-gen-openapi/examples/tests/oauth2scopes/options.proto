syntax = "proto3";

package tests.oauth2scopes;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/google/gnostic/cmd/protoc-gen-openapi/examples/tests/oauth2scopes;oauth2scopes";

extend google.protobuf.MethodOptions {
  Auth auth = 4290001;
}

message Auth {
  // Comma-separated OAuth2 scopes; multiple scopes are any-of.
  string oauth2_scopes = 1;
}
